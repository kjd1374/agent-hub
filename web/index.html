<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작업실</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
  --accent: #2f5bd3; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --info: #2f5bd3;
  --code: #f1f0ec; --add: #e6f4ea; --del: #fbe9e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
    --accent: #7c9cf5; --accent-ink: #10131c; --ok: #4cc283; --warn: #e0a84a; --bad: #ef6f61; --info: #7c9cf5;
    --code: #262624; --add: #1d3326; --del: #3a2220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar h1 { font-size: 17px; margin: 0; cursor: pointer; }
.bar nav { display: flex; gap: 4px; margin-left: auto; }
.bar nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 8px; }
.bar nav a.on { color: var(--ink); background: var(--card); border: 1px solid var(--line); }
.usage { font-size: 12px; color: var(--muted); width: 100%; }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 16px; margin: 0 0 6px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.click { cursor: pointer; }
.click:hover { border-color: var(--accent); }
input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.s-진행 { color: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
.s-실행요청 { color: var(--info); }
.s-검증완료 { color: var(--ok); }
.s-완료, .s-답변완료 { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.s-보고필요 { color: var(--bad); }
.s-대기, .s-취소, .s-대기\(사용량\), .s-넘김, .s-돌쇠로 { color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
.task { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .t { flex: 1; min-width: 0; }
.task .id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
pre { background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
pre.diff { white-space: pre; }
.diff .a { background: var(--add); display: block; }
.diff .d { background: var(--del); display: block; }
.diff .h { color: var(--muted); display: block; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 8px 0; }
.plan-item { border-top: 1px solid var(--line); padding: 10px 0; }
.plan-item:first-child { border-top: 0; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
.counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.joblog { max-height: 240px; overflow-y: auto; }
a { color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<header><div class="bar">
  <h1 id="home">작업실</h1>
  <nav id="nav" hidden><a href="#/" data-k="p">프로젝트</a><a href="#/settings" data-k="s">설정</a></nav>
  <div class="usage" id="usage"></div>
</div></header>
<main id="app"></main>
<script>
"use strict";
const $app = document.getElementById("app");
let timer = null;

// ---------- 공통 ----------
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
function toast(msg) {
  const t = el("div", { class: "toast" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Hub": "1" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("로그인 필요"); }
  if (!r.ok) throw new Error(data.error || `오류 ${r.status}`);
  return data;
}
function put(...nodes) { $app.replaceChildren(...nodes.flat().filter(Boolean)); }
function badge(s) { return el("span", { class: `badge s-${s}` }, s || "대기"); }
function clearTimer() { if (timer) { clearInterval(timer); timer = null; } }
function poll(fn, ms) { clearTimer(); timer = setInterval(fn, ms); }

// ---------- 로그인 ----------
function showLogin() {
  clearTimer();
  document.getElementById("nav").hidden = true;
  const pw = el("input", { type: "password", placeholder: "비밀번호", autocomplete: "current-password" });
  const go = async () => {
    try { await api("/api/login", { password: pw.value }); route(); }
    catch (e) { toast(e.message); }
  };
  pw.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  put(el("div", { class: "card" }, el("h2", {}, "로그인"), pw, el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "primary", onclick: go }, "들어가기"))));
  pw.focus();
}

// ---------- 백그라운드 일(작업 진행 표시) ----------
function watchJob(jid, onDone) {
  const log = el("pre", { class: "joblog" }, "시작…");
  const card = el("div", { class: "card" }, el("h2", {}, "진행 중"), log);
  $app.prepend(card);
  poll(async () => {
    const j = await api(`/api/jobs/${jid}`);
    log.textContent = j.lines.join("\n") || "…";
    log.scrollTop = log.scrollHeight;
    if (j.done) { clearTimer(); if (j.ok) onDone(j.result, card); else card.querySelector("h2").textContent = "실패"; }
  }, 1500);
}

// ---------- 계획 확인 ----------
function showPlan(name, tasks) {
  const list = tasks.map(t => ({ ...t, keep: true }));
  const box = el("div", { class: "card" });
  const draw = () => {
    box.replaceChildren(
      el("h2", {}, `${name} 작업 계획 (${list.filter(t => t.keep).length}개)`),
      el("div", { class: "muted" }, "위에서부터 하나씩 실행됩니다. 앞 작업이 반영돼야 다음이 시작됩니다. 필요 없는 것은 빼세요."),
      ...list.map((t, i) => el("div", { class: "plan-item", style: t.keep ? "" : "opacity:.4" },
        el("div", { class: "row" }, el("b", { class: "grow" }, `${i + 1}. ${t.title}`), el("span", { class: "muted" }, `${t.type} · 난도 ${t.difficulty}`),
          el("button", { onclick: () => { t.keep = !t.keep; draw(); } }, t.keep ? "빼기" : "넣기")),
        t.goal ? el("div", { class: "muted" }, t.goal) : null,
        t.criteria?.length ? el("ul", { class: "muted", style: "margin:4px 0 0;padding-left:18px" }, ...t.criteria.map(c => el("li", {}, c))) : null,
        t.verify ? el("div", { class: "muted" }, `검증: ${t.verify}`) : null)),
      el("div", { class: "row", style: "margin-top:12px" },
        el("button", { class: "primary", onclick: async () => {
          const keep = list.filter(t => t.keep);
          if (!keep.length) return toast("작업이 없습니다");
          try { const r = await api(`/api/projects/${name}/start`, { tasks: keep }); toast(`시작: ${r.started.join(", ")}`); location.hash = `#/p/${name}`; route(); }
          catch (e) { toast(e.message); }
        } }, "이대로 시작"),
        el("button", { onclick: () => box.remove() }, "취소")));
  };
  draw();
  $app.prepend(box);
}

// ---------- 프로젝트 목록 ----------
async function showProjects() {
  const data = await api("/api/overview");
  setUsage(data);
  const name = el("input", { placeholder: "예: shop-landing (영어 소문자·숫자·-)" });
  const goal = el("textarea", { placeholder: "무엇을 만들까요? 예: 동네 빵집 소개 웹사이트. 메뉴·위치·영업시간 페이지, 모바일 우선." });
  const auto = el("input", { type: "checkbox", style: "width:auto" });
  const create = async () => {
    try {
      const r = await api("/api/projects", { name: name.value.trim(), goal: goal.value.trim(), autostart: auto.checked });
      watchJob(r.job, (res, card) => {
        if (res.plan) { card.remove(); showPlan(res.project, res.plan); }
        else { toast("시작했습니다"); location.hash = `#/p/${res.project}`; route(); }
      });
    } catch (e) { toast(e.message); }
  };
  put(
    data.running ? el("div", { class: "card click", onclick: () => location.hash = `#/t/${data.running.id}` },
      el("div", { class: "row" }, badge("진행"), el("span", { class: "grow" }, `${data.running.project} · ${data.running.title}`), el("span", { class: "muted" }, data.running.id))) : null,
    ...data.projects.map(p => el("div", { class: "card click", onclick: () => location.hash = `#/p/${p.name}` },
      el("div", { class: "row" }, el("h2", { class: "grow" }, p.name), p.auto_merge ? el("span", { class: "muted" }, "자동 반영") : null),
      el("div", { class: "muted" }, p.description || ""),
      el("div", { class: "counts" }, ...Object.entries(p.counts).map(([s, n]) => el("span", { class: `badge s-${s}` }, `${s} ${n}`))))),
    el("div", { class: "card" }, el("h2", {}, "새 프로젝트"),
      el("div", { class: "muted" }, "GitHub 비공개 저장소를 만들고, Claude가 작업 계획을 세운 뒤 Codex 작성 → Claude 검증으로 하나씩 진행합니다."),
      el("label", {}, "이름"), name, el("label", {}, "목표"), goal,
      el("label", { class: "row", style: "color:var(--ink)" }, auto, "계획 확인 없이 바로 시작"),
      el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "primary", onclick: create }, "만들기"))));
}

function setUsage(data) {
  document.getElementById("usage").textContent = `Codex 사용량: ${data.usage.codex} · Claude: ${data.usage.claude}`;
}

// ---------- 프로젝트 ----------
async function showProject(name) {
  const [ov, tl] = await Promise.all([api("/api/overview"), api(`/api/projects/${name}/tasks`)]);
  setUsage(ov);
  const p = ov.projects.find(x => x.name === name);
  if (!p) { put(el("div", { class: "empty" }, "없는 프로젝트")); return; }
  const text = el("textarea", { placeholder: "무엇을 할까요? 질문이면 바로 답하고, 작업이면 알맞은 에이전트에게 맡깁니다." });
  const ask = async () => {
    if (!text.value.trim()) return;
    try { const r = await api(`/api/projects/${name}/ask`, { text: text.value }); text.value = ""; toast(`${r.id} 맡김`); showProject(name); }
    catch (e) { toast(e.message); }
  };
  const plan = async () => {
    if (!text.value.trim()) return toast("큰 목표를 적어 주세요");
    try { const r = await api(`/api/projects/${name}/propose`, { goal: text.value }); watchJob(r.job, (res, card) => { card.remove(); showPlan(name, res.plan); }); }
    catch (e) { toast(e.message); }
  };
  const am = el("input", { type: "checkbox", style: "width:auto", checked: p.auto_merge, onchange: async e => {
    try { await api(`/api/projects/${name}/settings`, { auto_merge: e.target.checked }); toast("저장했습니다"); } catch (err) { toast(err.message); }
  } });
  put(
    el("div", { class: "card" },
      el("div", { class: "row" }, el("h2", { class: "grow" }, name), el("a", { href: `https://github.com/${p.github}`, target: "_blank", rel: "noopener" }, "GitHub")),
      el("div", { class: "muted" }, `${p.description || ""} · ${p.repo}`),
      el("label", { class: "row", style: "color:var(--ink)" }, am, "검증 통과하면 자동 반영")),
    el("div", { class: "card" }, text,
      el("div", { class: "row", style: "margin-top:8px" },
        el("button", { class: "primary", onclick: ask }, "맡기기"),
        el("button", { onclick: plan }, "큰 목표 → 계획 세우기"))),
    el("div", { class: "card" }, el("h2", {}, "작업"),
      tl.tasks.length ? el("div", {}, ...tl.tasks.map(t => el("div", { class: "task click", onclick: () => location.hash = `#/t/${t.id}` },
        badge(t.status), el("div", { class: "t" }, el("div", {}, t.title), el("div", { class: "id" }, `${t.id} · ${t.type || "auto"}${t.impl ? " · " + t.impl + " 작성" : ""}${t.after ? " · " + t.after + " 다음" : ""}`)))))
        : el("div", { class: "empty" }, "아직 작업이 없습니다")));
  if (tl.tasks.some(t => ["진행", "실행요청"].includes(t.status))) poll(() => { if (location.hash === `#/p/${name}`) showProject(name); }, 6000);
}

// ---------- 작업 ----------
function diffView(text) {
  const pre = el("pre", { class: "diff" });
  for (const line of text.split("\n")) {
    const c = line.startsWith("+") && !line.startsWith("+++") ? "a" : line.startsWith("-") && !line.startsWith("---") ? "d" : /^(diff|index|@@|\+\+\+|---)/.test(line) ? "h" : "";
    pre.append(el("span", { class: c }, line + "\n"));
  }
  return pre;
}
function section(title, body, open = true) {
  if (!body) return null;
  return open ? el("div", {}, el("h3", {}, title), el("pre", {}, body))
              : el("details", {}, el("summary", {}, title), el("pre", {}, body));
}
async function showTask(id) {
  const d = await api(`/api/tasks/${id}`);
  const m = d.meta, s = d.sections, st = m.status || "대기";
  const extra = el("textarea", { placeholder: "추가로 고칠 점(선택)" });
  const act = async (action, body) => {
    try { const r = await api(`/api/tasks/${id}/${action}`, body || {}); toast(r.message || "처리했습니다"); showTask(id); }
    catch (e) { toast(e.message); }
  };
  const proj = m.project || "";
  put(
    el("div", { class: "card" },
      el("div", { class: "row" }, badge(st), el("h2", { class: "grow", style: "margin:0" }, m.title), el("span", { class: "muted" }, id)),
      el("div", { class: "muted" }, [proj && `프로젝트 ${proj}`, m.type && `유형 ${m.type}`, m.difficulty && `난도 ${m.difficulty}`, m.impl && `${m.impl} 작성`].filter(Boolean).join(" · ")),
      el("div", { class: "row", style: "margin-top:10px" },
        st === "검증완료" ? el("button", { class: "primary", onclick: () => act("merge") }, "반영") : null,
        ["검증완료", "보고필요", "대기(사용량)", "취소", "대기"].includes(st) ? el("button", { onclick: () => act("retry", { text: extra.value }) }, "다시 맡기기") : null,
        !["진행", "완료", "답변완료", "취소"].includes(st) ? el("button", { class: "danger", onclick: () => act("cancel") }, "취소") : null,
        proj ? el("button", { onclick: () => location.hash = `#/p/${proj}` }, "프로젝트로") : null),
      ["검증완료", "보고필요", "대기(사용량)", "취소", "대기"].includes(st) ? el("div", { style: "margin-top:8px" }, extra) : null),
    el("div", { class: "card" },
      section("결과", s["최근 결과"]), section("검증 판정", s["최근 리뷰"]), section("남은 일", s["남은 일"]),
      section("목표", s["목표"], false), section("완료 기준", s["완료 기준"], false),
      section("배정 이유", s["배정 기록"], false), section("진행 기록", s["한 일"], false),
      section("검증 기록", s["검증"], false), section("설계 메모", s["설계 메모"], false), section("사용량", s["사용량 기록"], false),
      d.diff ? el("details", {}, el("summary", {}, "변경 내용"), diffView(d.diff)) : null));
  if (["진행", "실행요청"].includes(st)) poll(() => { if (location.hash === `#/t/${id}`) showTask(id); }, 5000);
}

// ---------- 설정 ----------
async function showSettings() {
  const c = await api("/api/capabilities");
  const a = c.auto || {};
  const list = (title, arr) => el("div", {}, el("h3", {}, title), arr && arr.length ? el("div", { class: "counts" }, ...arr.map(x => el("span", { class: "badge" }, x))) : el("div", { class: "muted" }, "없음"));
  put(
    el("div", { class: "card" }, el("h2", {}, "에이전트 능력"),
      el("div", { class: "muted" }, `마지막 수집: ${a.collected_at || "-"} (${a.host || "-"})`),
      list("Claude 스킬", a.claude?.skills), list("Claude MCP", a.claude?.mcp),
      el("h3", {}, "Claude 플러그인"), el("pre", {}, (a.claude?.plugins_raw || []).join("\n") || "-"),
      list("Codex 스킬", a.codex?.skills), list("Codex MCP", a.codex?.mcp_enabled),
      el("div", { class: "muted", style: "margin-top:8px" }, `Codex 모델 ${a.codex?.model || "-"} · 기본 추론 강도 ${a.codex?.model_reasoning_effort || "-"} (작업마다 낮춰서 지정)`),
      el("div", { class: "row", style: "margin-top:10px" }, el("button", { onclick: async () => {
        try { const r = await api("/api/capabilities/refresh", {}); watchJob(r.job, () => showSettings()); } catch (e) { toast(e.message); }
      } }, "다시 수집"))),
    el("div", { class: "card" }, el("h2", {}, "플러그인 설치·제거"),
      el("div", { class: "muted" }, "다음 단계에서 추가됩니다. 공식 마켓 목록에서 고르고, 설치 전에 확인창을 띄웁니다.")),
    el("div", { class: "card" }, el("h2", {}, "안전 설정"),
      list("보호 경로(에이전트 접근 금지)", c.protected_paths), list("허용된 검증 명령", c.verify_allowed),
      el("h3", {}, "유형별 기본 담당"), el("pre", {}, Object.entries(c.type_defaults || {}).map(([k, v]) => `${k} → ${v}`).join("\n"))),
    el("div", { class: "card" }, el("button", { class: "danger", onclick: async () => { await api("/api/logout", {}); showLogin(); } }, "로그아웃")));
}

// ---------- 라우팅 ----------
async function route() {
  clearTimer();
  document.getElementById("nav").hidden = false;
  const h = location.hash || "#/";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", (a.dataset.k === "s") === h.startsWith("#/settings")));
  try {
    let m;
    if ((m = h.match(/^#\/p\/([a-z0-9-]+)/))) await showProject(m[1]);
    else if ((m = h.match(/^#\/t\/(T-\d+)/))) await showTask(m[1]);
    else if (h.startsWith("#/settings")) await showSettings();
    else await showProjects();
  } catch (e) { if (e.message !== "로그인 필요") put(el("div", { class: "empty" }, e.message)); }
}
document.getElementById("home").addEventListener("click", () => { location.hash = "#/"; });
window.addEventListener("hashchange", route);
route();
</script>
</body>
